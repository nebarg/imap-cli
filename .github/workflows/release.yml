name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Run the JavaScript-based actions on Node.js 24. Node 20 is deprecated;
  # the runner default flips on 2026-06-16, so opt in early to silence the
  # warning. Remove once all actions ship Node 24 support by default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="imap-cli-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags="-s -w -X go-imap-cli/cmd.version=${GITHUB_REF_NAME}" \
            -o "$out" .
          tar -czf "$out.tar.gz" "$out"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: imap-cli-*.tar.gz
