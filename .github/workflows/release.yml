name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go.mod's `go` line is the minimum version, so setup-go would install
          # exactly that release. Track the latest 1.26 patch for stdlib fixes.
          go-version: "1.26.x"
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="imap-cli-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags="-s -w -X go-imap-cli/cmd.version=${GITHUB_REF_NAME}" \
            -o "$out" .
          tar -czf "$out.tar.gz" "$out"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: imap-cli-*.tar.gz
