name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's `go` line is the minimum version, so setup-go would install
          # exactly that release. Track the latest 1.26 patch for stdlib fixes.
          go-version: "1.26.x"
          check-latest: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's `go` line is the minimum version, so setup-go would install
          # exactly that release. Track the latest 1.26 patch for stdlib fixes.
          go-version: "1.26.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
